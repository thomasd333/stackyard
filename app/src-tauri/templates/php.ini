; Generated by Stackyard - do not edit, changes will be lost.
; Put your own settings in {{CONFIG}}/php/conf.d/*.ini (appended at the end, so they win).
[PHP]
engine = On
short_open_tag = Off
output_buffering = 4096
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = "{{LOGS}}/php_error.log"
file_uploads = On
post_max_size = 128M
upload_max_filesize = 128M
upload_tmp_dir = "{{TMP}}"
sys_temp_dir = "{{TMP}}"
allow_url_fopen = On
default_charset = "UTF-8"
extension_dir = "{{PHP_DIR}}/ext"

{{EXTENSIONS}}

[mail function]
; mail() delivers to Mailpit (when it runs), which keeps the messages instead of sending them.
SMTP = 127.0.0.1
smtp_port = {{SMTP_PORT}}
sendmail_from = "stackyard@localhost"

[Date]
date.timezone = UTC

[Session]
session.save_handler = files
session.save_path = "{{TMP}}"
session.use_strict_mode = 1
session.cookie_httponly = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; Windows: if a process cannot attach to the shared memory (ASLR), fall back to the file cache
; instead of failing with "Opcode handlers are unusable due to ASLR".
opcache.file_cache = "{{TMP}}/opcache"
opcache.file_cache_fallback = 1

{{XDEBUG}}

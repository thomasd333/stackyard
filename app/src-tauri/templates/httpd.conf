# Generated by Stackyard on every Apache start - do not edit, changes will be lost.
# Put your own directives in {{CONFIG}}/apache/conf.d/*.conf
Define SRVROOT "{{APACHE_DIR}}"
ServerRoot "${SRVROOT}"

Listen {{PORT}}
ServerName localhost:{{PORT}}
ServerAdmin admin@localhost

{{MODULES}}

PidFile "{{TMP}}/httpd.pid"
ErrorLog "{{LOGS}}/apache_error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "{{LOGS}}/apache_access.log" combined

TypesConfig conf/mime.types
AcceptFilter http none
AcceptFilter https none
EnableSendfile off
EnableMMAP off
Timeout 300

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "{{WWW}}"
<Directory "{{WWW}}">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.php index.html index.htm

<Files ".ht*">
    Require all denied
</Files>

{{SITES}}

{{PHP}}

IncludeOptional "{{CONFIG}}/apache/conf.d/*.conf"

# Generated by Stackyard on every MySQL start - do not edit, changes will be lost.
# Put your own settings in {{CONFIG}}/mysql/conf.d/*.cnf
[client]
port = {{PORT}}

[mysqld]
basedir = "{{MYSQL_DIR}}"
datadir = "{{DATADIR}}"
port = {{PORT}}
bind-address = 127.0.0.1
mysqlx = OFF
log-error = "{{LOGS}}/mysql_error.log"
tmpdir = "{{TMP}}"
skip-log-bin
innodb_buffer_pool_size = 256M
max_allowed_packet = 64M
secure-file-priv = ""

!includedir {{CONFIG}}/mysql/conf.d
